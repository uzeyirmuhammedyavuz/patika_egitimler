<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 1998 Beta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="https://web.archive.org/web/19990504112211im_/http://www.google.com/google.jpg"
                alt="Google! Beta">
        </div>

        <div class="search-section">
            <p>Search the web using Google!</p>
            <input type="text" class="search-input">
            <div class="search-buttons">
                <button>Google Search</button>
                <button>I'm feeling lucky</button>
            </div>

            <div class="columns">
                <div class="col col-left">
                    <p>Special Searches</p>
                    <a href="#">Stenford Search</a><br>
                    <a href="#">Linux Search</a>
                </div>

                <div class="col col-center">
                    <a href="#">Help!</a><br>
                    <a href="#">About Google</a><br>
                    <a href="#">Company İnfo</a><br>
                    <a href="#">Google Logos!</a>
                </div>

                <div class="col col-right">
                    <p>Get Google!<br>Updates Monthly</p>
                    <input type="text" value="Your Email" class="email-input"><br>
                    <button>Subscribe</button> <a href="#">Archive</a>
                </div>

            </div>

            <div class="footer">
                <p>Copyright &copy;1998 Google Inc.</p>
            </div>

</body>

</html>
